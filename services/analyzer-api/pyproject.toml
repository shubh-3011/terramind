[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terramind-analyzer-api"
version = "0.0.1"
description = "Local analysis service for the TerraMind Code-OSS fork."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-hcl2>=7.3,<8",
    "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
    "scikit-learn>=1.6,<2"
]
sft-data = [
    "datasets>=3,<5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "terramind_ml*"]
